<svg xmlns="http://www.w3.org/2000/svg" width="440" height="265" viewBox="0 0 440 265">
<style>
  .fl { animation: fl 4.2s ease-in-out infinite; animation-delay: -0.55s; }
  @keyframes fl { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .sh { animation: sh 4.2s ease-in-out infinite; animation-delay: -0.55s; transform-box: fill-box; transform-origin: center; }
  @keyframes sh { 0%,100% { transform: scaleX(1); opacity: .45; } 50% { transform: scaleX(.86); opacity: .2; } }
  .fp { animation: fp 9s cubic-bezier(.45,0,.2,1) infinite; animation-delay: 0.70s; transform-box: fill-box; transform-origin: center; }
  @keyframes fp { 0%,78% { transform: scaleX(1) skewY(0); } 83% { transform: scaleX(.02) skewY(-12deg); } 88% { transform: scaleX(-1) skewY(0); }
                   93% { transform: scaleX(.02) skewY(12deg); } 98%,100% { transform: scaleX(1) skewY(0); } }
  .g { animation: pulse 4s ease-in-out infinite; } @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .6; } }
  .sw { animation: sw 7s ease-in-out infinite; animation-delay: 0.90s; }
  @keyframes sw { 0%,70% { transform: translateX(-260px); } 100% { transform: translateX(700px); } }
  .live { animation: live 1.6s ease-in-out infinite; } @keyframes live { 50% { opacity: .25; } }
</style>
<defs>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121c26"/><stop offset="1" stop-color="#0b1117"/></linearGradient>
  <radialGradient id="r" cx="1" cy="0" r="1"><stop offset="0" stop-color="#F59E0B" stop-opacity=".5"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
  <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity=".04"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="swg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="ed" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#563703"/><stop offset=".5" stop-color="#875705"/><stop offset="1" stop-color="#492f03"/></linearGradient>
  <clipPath id="c"><rect x=".5" y=".5" width="439" height="229" rx="16"/></clipPath>
  <filter id="bl" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<ellipse class="sh" filter="url(#bl)" cx="220.0" cy="256" rx="190.0" ry="7" fill="#F59E0B" opacity=".4"/>
<g class="fl"><g transform="translate(0 10)">
  <rect x="0" y="9" width="440" height="230" rx="16" fill="url(#ed)"/>
  <rect x="0" y="4.5" width="440" height="230" rx="16" fill="#6e4704"/>
  <g clip-path="url(#c)">
    <rect width="440" height="230" fill="url(#b)"/>
    <rect class="g" width="440" height="230" fill="url(#r)"/>
    <rect width="440" height="4" fill="#F59E0B"/>
    <rect class="sw" x="0" y="0" width="180" height="230" fill="url(#swg)" transform="skewX(-20)"/>
  </g>
  <rect x=".5" y=".5" width="439" height="229" rx="16" fill="none" stroke="#fff" stroke-opacity=".12"/>
  <g transform="translate(26 22)"><g class="fp">
    <rect x="0" y="6" width="48" height="48" rx="12" fill="#623f04"/>
    <rect x="0" y="3" width="48" height="48" rx="12" fill="#9f6606"/>
    <rect width="48" height="48" rx="12" fill="#1a2430"/>
    <rect width="48" height="48" rx="12" fill="#F59E0B" fill-opacity=".16"/>
    <text x="24" y="32" text-anchor="middle" font-size="23">💳</text>
    <rect width="48" height="48" rx="12" fill="url(#gl)"/>
    <rect x=".5" y=".5" width="47" height="47" rx="11.5" fill="none" stroke="#F59E0B" stroke-opacity=".6"/>
  </g></g>
  <text x="88" y="46" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f4f7fb">Ynmo Pay</text>
  <text x="88" y="67" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#F59E0B" letter-spacing=".4">PAYMENT MICROSERVICE</text>
  
  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#a9b3c9"><text x="26" y="112">MyFatoorah cards, Tabby BNPL and STC Bank B2B payroll</text><text x="26" y="134">behind one API, with two-way Qoyod accounting sync.</text></g>
  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e5e7eb"><rect x="26" y="186" width="103" height="24" rx="12" fill="#F59E0B" fill-opacity=".14" stroke="#F59E0B" stroke-opacity=".45"/><text x="77.5" y="202.5" text-anchor="middle">OAuth2/mTLS</text><rect x="137" y="186" width="81" height="24" rx="12" fill="#F59E0B" fill-opacity=".14" stroke="#F59E0B" stroke-opacity=".45"/><text x="177.5" y="202.5" text-anchor="middle">Webhooks</text><rect x="226" y="186" width="59" height="24" rx="12" fill="#F59E0B" fill-opacity=".14" stroke="#F59E0B" stroke-opacity=".45"/><text x="255.5" y="202.5" text-anchor="middle">Swarm</text><rect x="293" y="186" width="44" height="24" rx="12" fill="#F59E0B" fill-opacity=".14" stroke="#F59E0B" stroke-opacity=".45"/><text x="315.0" y="202.5" text-anchor="middle">GCP</text></g>
</g></g>
</svg>