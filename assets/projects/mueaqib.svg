    <text x="24" y="32" text-anchor="middle" font-size="23">🏛️</text>
    <rect width="48" height="48" rx="12" fill="url(#gl)"/>
    <rect x=".5" y=".5" width="47" height="47" rx="11.5" fill="none" stroke="#A78BFA" stroke-opacity=".6"/>
  </g></g>
  <text x="88" y="46" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f4f7fb">Mueaqib</text>
  <text x="88" y="67" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#A78BFA" letter-spacing=".4">GOV-SERVICES MARKETPLACE · KSA</text>
  <g transform="translate(366 26)"><rect width="52" height="20" rx="10" fill="#10D59A" fill-opacity=".12" stroke="#10D59A" stroke-opacity=".5"/>
