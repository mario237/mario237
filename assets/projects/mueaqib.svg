  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#a9b3c9"><text x="26" y="112">Connects citizens with licensed offices for government</text><text x="26" y="134">and administrative transactions, aligned with Vision</text><text x="26" y="156">2030.</text></g>
  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e5e7eb"><rect x="26" y="186" width="103" height="24" rx="12" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".45"/><text x="77.5" y="202.5" text-anchor="middle">Marketplace</text><rect x="137" y="186" width="44" height="24" rx="12" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".45"/><text x="159.0" y="202.5" text-anchor="middle">KSA</text><rect x="189" y="186" width="44" height="24" rx="12" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".45"/><text x="211.0" y="202.5" text-anchor="middle">RTL</text><rect x="241" y="186" width="88" height="24" rx="12" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".45"/><text x="285.0" y="202.5" text-anchor="middle">Workflows</text></g>
